<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Page Demo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px; }
    h1 { color: #333; }
    p { color: #666; }
    .highlight { color: #007bff; font-weight: bold; }
    .extra-section { margin-top: 24px; padding: 16px; background: #e3f2fd; border-radius: 6px; }
    img { display: block; margin: 16px auto; max-width: 100%; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Simple Page Demo</h1>
    <p>This is a simple HTML page with a touch of CSS styling.</p>
    <p class="highlight">Enjoy exploring!</p>
    <div class="extra-section">
      <h2>New Content Section</h2>
      <p>Here is some additional content to make the page more engaging. You can add images, links, or interactive elements as needed.</p>
      <img src="https://via.placeholder.com/400x200.png?text=Sample+Image" alt="Sample Image">
    </div>
  </div>
</body>
</html>
