<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Page Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 16px;
        }
        p {
            color: #555;
            font-size: 1.1em;
        }
        ul {
            color: #444;
            font-size: 1em;
            margin-top: 20px;
        }
        .footer {
            margin-top: 32px;
            font-size: 0.95em;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Simple Page Demo</h1>
        <p>This is a simple HTML page created as a demo, now with added CSS styling for a cleaner look.</p>
        <ul>
            <li>Easy to use and modify</li>
            <li>Responsive design</li>
            <li>Clean and modern layout</li>
        </ul>
        <div class="footer">
            &copy; 2025 Simple Page Demos
        </div>
    </div>
</body>
</html>
